# Netlify-Konfiguration: Drifting Chords wird verschleiert gebaut und aus dist/ ausgeliefert.
# (Hat Vorrang vor den Einstellungen in der Netlify-Oberfläche.)
[build]
  # verschleierte Fassung bauen (tools/build-web.mjs) und diese ausliefern
  publish = "dist"
  command = "node tools/build-web.mjs dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
