# Netlify-Konfiguration für diesen Branch: Chordwave aus dem Unterordner ausliefern.
# (Hat Vorrang vor den Einstellungen in der Netlify-Oberfläche.)
[build]
  publish = "chordwave"
  command = ""

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
