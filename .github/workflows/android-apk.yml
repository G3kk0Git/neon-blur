# Baut aus dem Ordner chordwave/ eine eigenständige Android-App (APK) mit Capacitor.
# Ergebnis: unter "Actions" → jeweiliger Lauf → "Artifacts" → DriftingChords-APK herunterladen.
name: Android APK

on:
  push:
    paths:
      - 'chordwave/**'
      - 'android-res/**'
      - 'tools/**'
      - 'package.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      REL_PW: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Capacitor-Projekt anlegen
        run: |
          mkdir apk && cd apk
          npm init -y > /dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          # verschleierte Fassung der App (Kommentare weg, Namen und Texte unkenntlich)
          (cd .. && npm install --no-audit --no-fund && node tools/build-web.mjs apk/www)
          sed -i "s/__BUILD__/1.0.${GITHUB_RUN_NUMBER}/" www/index.html
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "app.driftingchords",
            "appName": "Drifting Chords",
            "webDir": "www",
            "android": { "backgroundColor": "#0b0a12" }
          }
          JSON
          npx cap add android
          npx cap sync android
          # Startklang ohne vorheriges Tippen erlauben (Intro-Harmonie beim Öffnen)
          cat > android/app/src/main/java/app/driftingchords/MainActivity.java <<'JAVA'
          package app.driftingchords;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  this.bridge.getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false);
              }
          }
          JAVA

      - name: Icons, Startbild, Version und Signatur
        run: |
          RES=apk/android/app/src/main/res
          cp -r android-res/res/* "$RES/"
          find "$RES" -name 'splash.png' -exec cp android-res/splash.png {} \;
          # fester Debug-Schlüssel: neue APKs lassen sich über die alte installieren (Daten bleiben erhalten)
          cat >> apk/android/app/build.gradle <<'GRADLE'

          android {
              defaultConfig {
                  versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
                  versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "1")
              }
              signingConfigs {
                  debug {
                      storeFile file(System.getenv("KS_PATH"))
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          GRADLE
          # Veröffentlichungs-Signatur (nur wenn der geheime Schlüssel eingerichtet ist)
          cat >> apk/android/app/build.gradle <<'GRADLE'

          if (System.getenv("REL_KS")) {
              android {
                  signingConfigs {
                      release {
                          storeFile file(System.getenv("REL_KS"))
                          storePassword System.getenv("REL_PW")
                          keyAlias "driftingchords"
                          keyPassword System.getenv("REL_PW")
                      }
                  }
                  buildTypes { release { signingConfig signingConfigs.release } }
              }
          }
          GRADLE

      - name: APK bauen
        env:
          KS_PATH: ${{ github.workspace }}/android-res/chordwave-debug.keystore
        run: |
          cd apk/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/DriftingChords-1.0.${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/DriftingChords.apk"

      # Play-Store-Fassung (AAB) + signierte APK mit dem geheimen Schlüssel – nur als privates Artefakt, nie öffentlich
      - name: Veröffentlichungs-Fassung bauen
        if: env.REL_PW != '' && hashFiles('android-res/release.keystore.enc') != ''
        run: |
          export REL_KS="$RUNNER_TEMP/release.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android-res/release.keystore.enc -out "$REL_KS" -pass env:REL_PW
          cd apk/android
          ./gradlew bundleRelease assembleRelease --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/release-out"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/release-out/DriftingChords-1.0.${GITHUB_RUN_NUMBER}.aab"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/release-out/DriftingChords-1.0.${GITHUB_RUN_NUMBER}-release.apk"
          rm -f "$REL_KS"

      - name: Veröffentlichungs-Fassung sichern (privat)
        if: env.REL_PW != '' && hashFiles('android-res/release.keystore.enc') != ''
        uses: actions/upload-artifact@v4
        with:
          name: DriftingChords-PlayStore
          path: release-out/*
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: DriftingChords-APK
          path: DriftingChords-1.0.*.apk
          retention-days: 30

      # fester Download-Link: …/releases/download/apk-latest/DriftingChords.apk
      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Drifting Chords (aktuelle APK)
          body: |
            Aktuelle Test-APK von Drifting Chords – Harmony in endless motion. (Version 1.0.${{ github.run_number }}).
            Download: DriftingChords.apk – einfach über die alte Version installieren, Daten bleiben erhalten.
          files: DriftingChords.apk
          make_latest: true
          overwrite_files: true
