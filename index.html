function sndUpdate(){
  const c=snd.ctx;if(!c||!snd.g)return;

  const r=clamp(Math.abs(P.v)/(MAXV*1.2),0,1.3),n=c.currentTime;
  snd.o1.frequency.setTargetAtTime(50+r*190+(P.nitro>0?30:0),n,.05);snd.o2.frequency.setTargetAtTime(25+r*95,n,.05);
  snd.lp.frequency.setTargetAtTime(350+r*1400,n,.08);
  snd.g.gain.setTargetAtTime(P.wreck>0?0:.05+r*.07,n,.1);
  snd.ng.gain.setTargetAtTime(P.slide>100?clamp(P.slide/700,0,.25):r*.03,n,.05);
}
function sndHit(v){

  if(c===P){shk=Math.max(shk,clamp(v/18,.25,1));sndHit(v/25+.15);rumble(clamp(v/20,.3,1),260)}

function wwCheck(dt){

function leaderOf(){let l=null;for(const o of cars)if(o.wreck<=0&&(!l||rk(o)>rk(l)))l=o;return l||cars[0]}

  else if(it==='shield')c.shield=7;

  else if(it==='mine'){const f=dir>0?1:-1,o=dir>0?60:44;mines.push({x:c.x+Math.cos(c.a)*o*f,y:c.y+Math.sin(c.a)*o*f,z:c.z,o:c,life:40,ty:'mine'})}

    for(const o of cars)if(o!==c&&o.wreck<=0){const dx=o.x-c.x,dy=o.y-c.y,d=Math.hypot(dx,dy);if(d<150&&d>.1){strike(o,'barge',c);const f=(1-d/150)*520+160;o.wx+=dx/d*f;o.wy+=dy/d*f;o.stun=Math.max(o.stun,.3)}}

    for(let q=0;q<3;q++){
      while(acc<gaps[q]){const j=(i+1)%N;if(P2P&&i>=END-2)break;acc+=Math.hypot(pts[j][0]-pts[i][0],pts[j][1]-pts[i][1]);i=j}
      const [nx,ny]=nrm(i),off=(q-1)*34;

    if(c.bcd>0)return;c.bcd=c.ai?.7:.18;if(!(c.am>0))c.am=3;c.am--;
    {const bk=dir<0,ca=bk?c.a+Math.PI:c.a;shots.push({ty:'bolt',x:c.x+Math.cos(ca)*30,y:c.y+Math.sin(ca)*30,a:ca,o:c,dir:bk?-1:1,wait:0,life:1.6,z:c.z})}

}

let padNavT=0;

      const eX=evp(g,0),eO=evp(g,1),eSq=evp(g,2),eTr=evp(g,3),eL1=evp(g,4),eCr=evp(g,8),eOp=evp(g,9);

function track(c){
  let b=1e18,bi=c.idx;
  for(let k=-12;k<=12;k++){const j=(c.idx+k+N)%N,dx=pts[j][0]-c.x,dy=pts[j][1]-c.y,dd=dx*dx+dy*dy;if(dd<b){b=dd;bi=j}}
  if(P2P){if(!c.fin&&bi>=FIN){c.fin=true;c.fT=t;order.push(c);if(c.human){c.place=order.length;if(c===P)place=c.place;c.ai=true}}}
  else if(c.idx>N*.75&&bi<N*.25){c.lap++;if(c.lap>LAPS&&!c.fin){c.fin=true;c.fT=t;order.push(c);if(c.human){c.place=order.length;if(c===P)place=c.place;c.ai=true}}}
  else if(c.idx<N*.25&&bi>N*.75)c.lap--;
  c.idx=bi;c.dist=Math.sqrt(b);
}
function upd(c,dt){

  c.dcd=Math.max(0,c.dcd-dt);c.inv=Math.max(0,c.inv-dt);c.hitT=Math.max(0,c.hitT-dt);dmgFx(c,dt);
  let th=0,st=0,br=0;
  c.nitro=Math.max(0,c.nitro-dt);c.shield=Math.max(0,c.shield-dt);c.stun=Math.max(0,c.stun-dt);c.flip=Math.max(0,(c.flip||0)-dt);c.cool=Math.max(0,c.cool-dt);
